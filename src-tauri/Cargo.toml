[package]
name = "dsh-desktop"
version = "0.1.0"
description = "DSH Desktop - wraps the DeepSeek Harness web GUI"
authors = ["dsh"]
edition = "2021"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = { version = "5", features = ["shellexecute-on-windows"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
